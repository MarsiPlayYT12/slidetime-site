name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Hosting path for this build"
        required: false
        default: custom-domain
        type: choice
        options: [github-pages, custom-domain]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A stale Pages deployment must not hold newer site updates in the queue.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          DEPLOY_TARGET: ${{ inputs.deploy_target || vars.DEPLOY_TARGET || 'custom-domain' }}
        run: |
          if [ "$DEPLOY_TARGET" = "custom-domain" ]; then
            NEXT_PUBLIC_BASE_PATH="" npm run build
          else
            NEXT_PUBLIC_BASE_PATH="/slidetime-site" npm run build
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
